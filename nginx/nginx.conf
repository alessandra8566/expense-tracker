# Phase 2 — Production HTTPS config (used AFTER cert is obtained via init-ssl.sh)

# Keep a single client from exhausting worker connections or flooding the
# application endpoint. These zones consume a bounded amount of shared memory.
limit_req_zone  $binary_remote_addr zone=per_ip_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;

# Drop direct-IP traffic and requests with an unknown Host header. Without an
# explicit default server, nginx sends them through the first configured site.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name alessandra8566.com www.alessandra8566.com;
    server_tokens off;

    # Still serve ACME challenge for auto-renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server
server {
    listen 443 ssl;
    server_name alessandra8566.com www.alessandra8566.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/alessandra8566.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alessandra8566.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 1m;
    limit_conn per_ip_connections 10;

    # Only these two FastAPI routes are public. Reject scanner paths at nginx
    # so they never allocate an application worker or database session.
    location = /webhook {
        limit_except POST {
            deny all;
        }
        limit_req zone=per_ip_requests burst=20 nodelay;

        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        limit_req zone=per_ip_requests burst=5 nodelay;

        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location / {
        access_log off;
        return 404;
    }
}
