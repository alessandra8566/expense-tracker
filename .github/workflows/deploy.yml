name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────
  #  1. Run tests
  # ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          LINE_CHANNEL_SECRET: dummy
          LINE_CHANNEL_ACCESS_TOKEN: dummy
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
          APP_ENV: test
        run: pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Test Nginx security routing
        run: ./scripts/test-nginx-security.sh

  # ──────────────────────────────────────────────────────────────
  #  2. Build & push Docker image (only on main branch push)
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ──────────────────────────────────────────────────────────────
  #  3. Deploy to remote server via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/expense-tracker

            # ── Sync nginx configs and compose files from repo ──────────────
            git pull origin main

            # ── Write production env file from GitHub secrets ───────────────
            cat > .env.prod << 'EOF'
            LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}
            LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=expense_tracker
            DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/expense_tracker
            APP_ENV=production
            GITHUB_REPOSITORY=${{ github.repository }}
            EOF

            # Validate the production Compose configuration before changing services.
            docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet

            # ── Pull latest app image ───────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose --env-file .env.prod -f docker-compose.prod.yml pull app

            # ── Rolling restart (keeps nginx running) ───────────────────────
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            # ── Wait for the restarted app to pass its health check ──────────
            for attempt in $(seq 1 30); do
              app_health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' expense_app)
              if [ "$app_health" = "healthy" ]; then
                echo "Application health check passed"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Application failed to become healthy (status: $app_health)" >&2
                exit 1
              fi
              sleep 2
            done

            # ── Reload nginx and verify HTTPS health through the proxy ───────
            docker exec expense_nginx nginx -t
            docker exec expense_nginx nginx -s reload

            for attempt in $(seq 1 10); do
              if printf 'GET /health HTTP/1.1\r\nHost: alessandra8566.com\r\nConnection: close\r\n\r\n' | \
                openssl s_client -verify 5 -verify_return_error -verify_hostname alessandra8566.com \
                  -connect 127.0.0.1:443 -servername alessandra8566.com -quiet 2>/dev/null | \
                grep -q '"status":"ok"'; then
                echo "HTTPS health check passed"
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                echo "HTTPS health check failed after Nginx reload" >&2
                exit 1
              fi
              sleep 2
            done

            # ── Cleanup old images ──────────────────────────────────────────
            docker image prune -f
